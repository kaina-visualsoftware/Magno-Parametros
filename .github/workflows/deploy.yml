name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validar configuração pública
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Defina VITE_SUPABASE_URL nos secrets."; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::Defina VITE_SUPABASE_ANON_KEY nos secrets."; exit 1; }
      - name: Avisar quando o envio automático de sugestões não estiver configurado
        env:
          VITE_ISSUES_API_URL: ${{ vars.VITE_ISSUES_API_URL }}
        run: |
          if [ -z "$VITE_ISSUES_API_URL" ]; then
            echo "::warning::VITE_ISSUES_API_URL não configurada. A interface oferecerá criação manual da issue no GitHub."
          fi
      - name: Testes unitários do domínio
        run: npm test
      - name: Build de produção
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
