<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice"
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d10"/>
      <stop offset="100%" stop-color="#1a1c22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Phone mockup -->
  <g transform="translate(250,150)"
    <!-- Phone body -->
    <rect x="0" y="0" width="700" height="600" rx="30" ry="30" fill="#2a2c30"/>
    <!-- Screen background -->
    <rect x="20" y="20" width="660" height="560" fill="#0b0d10"/>
    <!-- UI inside screen (tags list) -->
    <g transform="translate(40,80)"
      <!-- Header -->
      <rect y="0" width="620" height="50" fill="rgba(255,255,255,0.04)"/>
      <circle cx="30" cy="25" r="12" fill="#6cd7bb"/>
      <text x="55" y="33" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#e0e0e0" font-weight="bold">MyCommerce</text>
      <!-- Tag cards -->
      <g transform="translate(0,70)"
        <!-- Tag 1 -->
        <rect width="620" height="50" rx="8" ry="8" fill="#1a1c22" filter="url(#shadow)"/>
        <text x="20" y="30" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#e0e0e0">Orçamento</text>
        <!-- Tag 2 -->
        <rect y="70" width="620" height="50" rx="8" ry="8" fill="#1a1c22" filter="url(#shadow)"/>
        <text x="20" y="100" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#e0e0e0">Financeiro</text>
        <!-- Tag 3 -->
        <rect y="140" width="620" height="50" rx="8" ry="8" fill="#1a1c22" filter="url(#shadow)"/>
        <text x="20" y="170" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#e0e0e0">Inventário</text>
      </g>
    </g>
    <!-- Keyboard base -->
    <rect x="0" y="620" width="700" height="30" fill="#2a2c30"/>
  </g>
  <!-- Footer accent line -->
  <rect y="795" width="1200" height="5" fill="#6cd7bb"/>
  <text x="50%" y="770" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#6cd7bb" text-anchor="middle">Gerenciamento de Tags</text>
</svg>
