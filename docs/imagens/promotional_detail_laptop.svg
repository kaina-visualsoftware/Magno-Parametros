<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d10"/>
      <stop offset="100%" stop-color="#1a1c22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Laptop mockup -->
  <g transform="translate(100,100)">
    <rect x="0" y="0" width="1000" height="600" rx="12" ry="12" fill="#2a2c30"/>
    <!-- Screen background -->
    <rect x="20" y="20" width="960" height="540" fill="#0b0d10"/>
    <!-- UI inside screen (detail view) -->
    <g transform="translate(40,80)">
      <!-- Header -->
      <rect y="0" width="880" height="50" fill="rgba(255,255,255,0.04)"/>
      <circle cx="30" cy="25" r="12" fill="#6cd7bb"/>
      <text x="55" y="33" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#e0e0e0" font-weight="bold">MyCommerce</text>
      <!-- Breadcrumb -->
      <text x="200" y="33" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#a3adb9">Utilitários > Configuração > Admin</text>
      <!-- Parameter title -->
      <text x="20" y="100" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#e0e0e0">Parâmetro XYZ</text>
      <!-- Fields -->
      <!-- O que faz -->
      <text x="20" y="140" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#a3adb9">O que faz:</text>
      <rect x="20" y="150" width="800" height="40" fill="#0b0d10"/>
      <!-- Impacto -->
      <text x="20" y="210" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#a3adb9">Impacto:</text>
      <rect x="20" y="220" width="800" height="40" fill="#0b0d10"/>
      <!-- Valor padrão -->
      <text x="20" y="280" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#a3adb9">Valor padrão:</text>
      <rect x="20" y="290" width="200" height="30" fill="#0b0d10"/>
    </g>
    <!-- Keyboard base -->
    <rect x="0" y="620" width="1000" height="40" fill="#2a2c30"/>
  </g>
  <!-- Footer accent line -->
  <rect y="795" width="1200" height="5" fill="#6cd7bb"/>
  <text x="50%" y="770" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#6cd7bb" text-anchor="middle">Detalhes do Parâmetro</text>
</svg>
