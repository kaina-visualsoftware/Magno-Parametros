<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d10"/>
      <stop offset="100%" stop-color="#1a1c22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Laptop body -->
  <g transform="translate(100,100)">
    <rect x="0" y="0" width="1000" height="600" rx="12" ry="12" fill="#2a2c30"/>
    <!-- Screen area -->
    <rect x="20" y="20" width="960" height="540" fill="#0b0d10"/>
    <!-- UI inside screen -->
    <g transform="translate(40,60)">
      <!-- Header -->
      <rect y="0" width="880" height="60" fill="rgba(255,255,255,0.04)"/>
      <circle cx="30" cy="30" r="12" fill="#6cd7bb"/>
      <text x="55" y="38" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#e0e0e0" font-weight="bold">MyCommerce</text>
      <rect x="250" y="15" width="500" height="30" rx="6" ry="6" fill="#303945"/>
      <text x="260" y="35" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#a3adb9">Buscar parâmetros…</text>
      <!-- Cards -->
      <g transform="translate(0,80)">
        <rect width="800" height="70" rx="8" ry="8" fill="#1a1c22" filter="url(#shadow)"/>
        <text x="20" y="30" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#e0e0e0">Parâmetro 1</text>
        <text x="20" y="55" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#a3adb9">Grupo A • Tipo Texto • Caminho</text>
        <rect y="90" width="800" height="70" rx="8" ry="8" fill="#1a1c22" filter="url(#shadow)"/>
        <text x="20" y="120" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#e0e0e0">Parâmetro 2</text>
        <text x="20" y="145" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#a3adb9">Grupo B • Tipo Número • Caminho</text>
        <rect y="180" width="800" height="70" rx="8" ry="8" fill="#1a1c22" filter="url(#shadow)"/>
        <text x="20" y="210" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#e0e0e0">Parâmetro 3</text>
        <text x="20" y="235" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#a3adb9">Grupo C • Tipo Valor • Caminho</text>
      </g>
    </g>
    <!-- Keyboard base -->
    <rect x="0" y="620" width="1000" height="40" fill="#2a2c30"/>
  </g>
  <!-- Footer accent -->
  <rect y="795" width="1200" height="5" fill="#6cd7bb"/>
  <text x="50%" y="770" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#6cd7bb" text-anchor="middle">Catálogo de Parâmetros</text>
</svg>
