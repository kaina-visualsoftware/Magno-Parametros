<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0d10"/>
      <stop offset="100%" stop-color="#1a1c22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <!-- Header -->
  <rect y="0" width="1200" height="60" fill="rgba(255,255,255,0.04)"/>
  <circle cx="30" cy="30" r="12" fill="#6cd7bb"/>
  <text x="55" y="38" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#e0e0e0" font-weight="bold">MyCommerce</text>
  <!-- Tag Management -->
  <g transform="translate(250,80)">
    <rect width="700" height="240" rx="12" ry="12" fill="#1a1c22" filter="url(#shadow)"/>
    <text x="30" y="30" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#e0e0e0">Gerenciamento de Tags</text>
    <text x="30" y="60" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#a3adb9">Organize os parâmetros com tags personalizadas</text>
    <!-- Tag List -->
    <g transform="translate(30,90)">
      <rect width="150" height="30" rx="5" ry="5" fill="#303945"/>
      <text x="10" y="20" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#e0e0e0">Orçamento</text>
      <rect x="170" width="150" height="30" rx="5" ry="5" fill="#303945"/>
      <text x="180" y="20" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#e0e0e0">Financeiro</text>
      <rect x="340" width="150" height="30" rx="5" ry="5" fill="#303945"/>
      <text x="350" y="20" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#e0e0e0">Inventário</text>
      <rect y="40" width="150" height="30" rx="5" ry="5" fill="#303945"/>
      <text x="10" y="60" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#e0e0e0">Configuração</text>
      <rect x="170" y="40" width="150" height="30" rx="5" ry="5" fill="#303945"/>
      <text x="180" y="60" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#e0e0e0">Relatórios</text>
      <rect x="340" y="40" width="150" height="30" rx="5" ry="5" fill="#303945"/>
      <text x="350" y="60" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#e0e0e0">Usuários</text>
    </g>
  </g>
  <rect y="395" width="1200" height="5" fill="#6cd7bb"/>
  <text x="50%" y="370" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#6cd7bb" text-anchor="middle">Gerenciamento de Tags</text>
</svg>
