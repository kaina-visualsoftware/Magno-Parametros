<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" preserveAspectRatio="xMidYMid slice">
  <!-- Background -->
  <rect width="1200" height="300" fill="#0b0d10"/>
  <!-- Top navigation bar -->
  <rect y="0" width="1200" height="50" fill="#1a1c22"/>
  <!-- Logo placeholder -->
  <circle cx="30" cy="25" r="12" fill="#6cd7bb"/>
  <text x="55" y="32" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#e0e0e0">MyCommerce</text>
  <!-- Search bar -->
  <rect x="250" y="10" width="500" height="30" rx="5" ry="5" fill="#303945"/>
  <text x="260" y="30" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#a3adb9">Buscar parâmetros...</text>
  <!-- Mock content cards -->
  <g transform="translate(250,70)">
    <!-- First card -->
    <rect width="500" height="70" rx="6" ry="6" fill="#1a1c22"/>
    <text x="15" y="30" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#e0e0e0">Nome do parâmetro 1</text>
    <text x="15" y="55" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#a3adb9">Grupo • Tipo • Caminho</text>
    <!-- Second card -->
    <rect y="90" width="500" height="70" rx="6" ry="6" fill="#1a1c22"/>
    <text x="15" y="120" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#e0e0e0">Nome do parâmetro 2</text>
    <text x="15" y="145" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#a3adb9">Grupo • Tipo • Caminho</text>
    <!-- Third card -->
    <rect y="180" width="500" height="70" rx="6" ry="6" fill="#1a1c22"/>
    <text x="15" y="210" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#e0e0e0">Nome do parâmetro 3</text>
    <text x="15" y="235" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#a3adb9">Grupo • Tipo • Caminho</text>
  </g>
  <!-- Footer accent line -->
  <rect y="295" width="1200" height="5" fill="#6cd7bb"/>
  <!-- Title overlay -->
  <text x="50%" y="260" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#6cd7bb" text-anchor="middle">Catálogo de Parâmetros</text>
</svg>
