<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>MyCommerce no desktop e no celular</title>
<style>
  * { box-sizing: border-box; }
  body { width: 1600px; height: 1120px; margin: 0; overflow: hidden; background: #191f26; color: #f3f5f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  h1 { margin: 62px 64px 16px; font-size: 57px; font-weight: 600; letter-spacing: -1.8px; }
  p { margin: 0 64px; color: #a3adb9; font-size: 26px; }
  figure { margin: 0; position: absolute; top: 235px; }
  .desktop { left: 64px; width: 1120px; }
  .mobile { right: 64px; width: 320px; }
  img { display: block; width: 100%; height: auto; border: 1px solid #303945; border-radius: 12px; }
  figcaption { padding-top: 22px; font-size: 23px; color: #a3adb9; }
</style>
<h1>Uma referência, em qualquer tela.</h1>
<p>Do catálogo completo à busca no celular. Temas claro e escuro.</p>
<figure class="desktop">
  <img src="screenshots/catalogo-escuro.png" alt="Catálogo real no desktop, em tema escuro.">
  <figcaption>Catálogo no desktop</figcaption>
</figure>
<figure class="mobile">
  <img src="screenshots/busca-mobile.png" alt="Busca real por estoque no celular, em tema claro.">
  <figcaption>Busca no celular</figcaption>
</figure>
</html>
