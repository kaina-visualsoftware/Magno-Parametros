<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<title>MyCommerce — Referência de parâmetros</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; width: 1600px; height: 900px; overflow: hidden; background: #0b0d10; color: #f3f5f7; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  header { padding: 58px 80px 0; display: flex; align-items: center; justify-content: space-between; }
  .marca { font-size: 66px; font-weight: 700; letter-spacing: -2.5px; }
  .categoria { font-size: 27px; color: #6cd7bb; text-align: right; line-height: 1.35; }
  h1 { margin: 38px 80px 24px; font-size: 62px; font-weight: 550; letter-spacing: -2px; line-height: 1.13; }
  .caminho { margin: 0 80px; color: #a3adb9; font-size: 23px; display: flex; align-items: center; gap: 20px; }
  .caminho span + span::before { content: '/'; padding-right: 20px; color: #6cd7bb; }
  .produto { position: absolute; left: 80px; top: 396px; width: 1440px; height: 504px; overflow: hidden; border: 1px solid #303945; border-radius: 16px 16px 0 0; }
  .produto img { display: block; width: 1440px; height: 960px; }
</style>
<header>
  <div class="marca">MyCommerce</div>
  <div class="categoria">Referência<br>de parâmetros</div>
</header>
<h1>Encontre o parâmetro.<br>Veja onde configurar.</h1>
<p class="caminho"><span>Utilitários</span><span>Configuração</span><span>Administração do Sistema</span></p>
